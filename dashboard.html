<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Lọc Tin Nhắn - Dashboard</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1e1e2f; color: #fff; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }
        h1 { margin-bottom: 20px; color: #00ff88; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #2a2a3e; padding: 20px; border-radius: 10px; flex: 1; text-align: center; }
        .stat-card h3 { font-size: 14px; color: #aaa; }
        .stat-card .number { font-size: 36px; font-weight: bold; color: #00ff88; }
        .two-columns { display: flex; gap: 20px; flex-wrap: wrap; }
        .panel { background: #2a2a3e; border-radius: 10px; padding: 20px; flex: 1; min-width: 300px; }
        .panel h2 { margin-bottom: 15px; font-size: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .word-list { max-height: 300px; overflow-y: auto; }
        .word-item { background: #3a3a4e; padding: 8px 12px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; }
        .word-item button { background: #ff4444; border: none; color: white; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
        .word-item button:hover { background: #cc0000; }
        .add-word { display: flex; gap: 10px; margin-top: 15px; }
        .add-word input { flex: 1; padding: 10px; border: none; border-radius: 5px; }
        .add-word button { background: #00ff88; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .violation-table { width: 100%; border-collapse: collapse; }
        .violation-table th, .violation-table td { padding: 10px; text-align: left; border-bottom: 1px solid #444; }
        .violation-table th { background: #1e1e2f; color: #00ff88; }
        .badge { background: #ff4444; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .refresh-btn { background: #00ff88; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>🤖 Bot Lọc Tin Nhắn - Dashboard</h1>
    
    <div class="stats">
        <div class="stat-card"><h3>Tổng số từ cấm</h3><div class="number" id="totalWords">0</div></div>
        <div class="stat-card"><h3>Tổng vi phạm</h3><div class="number" id="totalViolations">0</div></div>
        <div class="stat-card"><h3>Vi phạm hôm nay</h3><div class="number" id="todayViolations">0</div></div>
    </div>
    
    <div class="two-columns">
        <div class="panel">
            <h2>🚫 Quản lý từ cấm</h2>
            <div class="add-word">
                <input type="text" id="newWord" placeholder="Nhập từ cấm...">
                <button onclick="addWord()">➕ Thêm</button>
            </div>
            <div class="word-list" id="wordList"></div>
        </div>
        
        <div class="panel">
            <h2>📋 Lịch sử vi phạm <button class="refresh-btn" onclick="loadViolations()">🔄 Làm mới</button></h2>
            <div style="max-height: 400px; overflow-y: auto;">
                <table class="violation-table" id="violationTable">
                    <thead><tr><th>Thời gian</th><th>Người dùng</th><th>Nội dung</th><th>Lý do</th></tr></thead>
                    <tbody id="violationBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    
    // Socket events
    socket.on('new_violation', (data) => {
        addViolationToTable(data);
        loadStats();
    });
    socket.on('word_added', (word) => {
        loadWords();
    });
    socket.on('word_deleted', (word) => {
        loadWords();
    });
    
    async function loadStats() {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('totalWords').innerText = data.total_words;
        document.getElementById('totalViolations').innerText = data.total_violations;
        document.getElementById('todayViolations').innerText = data.today_violations;
    }
    
    async function loadWords() {
        const res = await fetch('/api/words');
        const words = await res.json();
        const container = document.getElementById('wordList');
        if (words.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center; color: #aaa;">Chưa có từ cấm nào</div>';
            return;
        }
        container.innerHTML = words.map(w => `
            <div class="word-item">
                <span>🚫 ${w}</span>
                <button onclick="deleteWord('${w}')">Xóa</button>
            </div>
        `).join('');
        loadStats();
    }
    
    async function addWord() {
        const input = document.getElementById('newWord');
        const word = input.value.trim();
        if (!word) return;
        await fetch('/api/words', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({word: word})
        });
        input.value = '';
        loadWords();
    }
    
    async function deleteWord(word) {
        await fetch(`/api/words/${encodeURIComponent(word)}`, {method: 'DELETE'});
        loadWords();
    }
    
    async function loadViolations() {
        const res = await fetch('/api/stats');
        const stats = await res.json();
        // Lấy violations từ API (cần thêm endpoint)
        const violRes = await fetch('/');
        const html = await violRes.text();
        // Cách đơn giản: reload lại trang hoặc fetch riêng
        location.reload();
    }
    
    function addViolationToTable(v) {
        const table = document.getElementById('violationBody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${v.time}</td>
            <td>${v.user_name}</td>
            <td>${v.text}</td>
            <td><span class="badge">${v.reason}</span></td>
        `;
        table.insertBefore(row, table.firstChild);
        if (table.children.length > 50) table.removeChild(table.lastChild);
    }
    
    // Initial load
    loadWords();
    loadStats();
    
    // Load violations from initial data
    const violations = {{ violations | tojson }};
    const tbody = document.getElementById('violationBody');
    violations.forEach(v => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${v.time}</td><td>${v.user_name}</td><td>${v.text}</td><td><span class="badge">${v.reason}</span></td>`;
        tbody.appendChild(row);
    });
</script>
</body>
</html>
